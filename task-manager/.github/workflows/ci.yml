name: CI

# Run on every push and on every pull request.
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ---------- Backend: compile and run all tests ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test

  # ---------- Frontend: install and build ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ---------- Docker: make sure both images build ----------
  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t task-manager-backend ./backend
      - name: Build frontend image
        run: docker build -t task-manager-frontend ./frontend
