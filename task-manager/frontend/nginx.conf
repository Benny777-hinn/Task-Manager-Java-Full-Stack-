# nginx config for the built React app.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the Spring Boot container ("backend" is the
    # service name in docker-compose, which Docker resolves to the container IP).
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also expose Swagger through the same origin (optional but handy).
    location /swagger-ui/ {
        proxy_pass http://backend:8081;
    }
    location /v3/api-docs/ {
        proxy_pass http://backend:8081;
    }

    # For any other path, return index.html so React Router handles the route
    # (this is what makes a page refresh on /dashboard work).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
